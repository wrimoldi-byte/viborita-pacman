<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viborita y Pac-Man</title>
<style>
  :root { color-scheme: dark; font-family: Arial, sans-serif; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:#0b1020; color:white;
  }
  .wrap { width:min(94vw,600px); padding:18px 0; text-align:center; }
  .top {
    display:flex; justify-content:space-between; align-items:center;
    gap:12px; flex-wrap:wrap; margin-bottom:12px;
  }
  .pill {
    background:#182033; border:1px solid #334155;
    border-radius:12px; padding:8px 12px;
  }
  canvas {
    width:100%; max-width:540px; aspect-ratio:1; display:block; margin:auto;
    background:#08111f; border:2px solid #334155; border-radius:16px;
    touch-action:none;
  }
  .help { color:#cbd5e1; font-size:14px; margin:12px 0; }
  button {
    background:#182033; border:1px solid #475569; color:white;
    border-radius:10px; padding:10px 14px; font-size:16px; cursor:pointer;
  }
  button:hover { background:#263247; }
  .controls {
    display:grid; grid-template-columns:repeat(3,64px);
    justify-content:center; gap:8px; margin-top:12px;
  }
  .blank { visibility:hidden; }
  #message { min-height:30px; margin-top:10px; font-weight:bold; font-size:18px; }
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <h1 style="font-size:22px;margin:0">🐍 Viborita perseguida</h1>
    <div class="pill">Puntaje: <strong id="score">0</strong></div>
  </div>

  <canvas id="game" width="540" height="540"></canvas>

  <p class="help">
    El perseguidor es la foto recortada con boca de Pac-Man.
    Se mueve lentamente y al tocar la viborita aparece un corazón.
  </p>

  <button id="restart" type="button">Reiniciar</button>

  <div class="controls">
    <button class="blank">·</button>
    <button id="up" type="button">▲</button>
    <button class="blank">·</button>
    <button id="left" type="button">◀</button>
    <button id="down" type="button">▼</button>
    <button id="right" type="button">▶</button>
  </div>

  <div id="message" aria-live="polite"></div>
</main>

let snake, direction, nextDirection, food, score, timer, playing;
let chaser, steps, heartUntil, lastTouch;

function randomFood() {
  let p;
  do {
    p = {x: Math.floor(Math.random()*grid), y: Math.floor(Math.random()*grid)};
  } while (
    snake.some(s => s.x===p.x && s.y===p.y) ||
    (chaser && chaser.x===p.x && chaser.y===p.y)
  );
  return p;
}

function reset() {
  clearInterval(timer);
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  direction = nextDirection = "RIGHT";
  chaser = {x:2,y:2};
  food = randomFood();
  score = 0;
  steps = 0;
  heartUntil = 0;
  lastTouch = -999;
  playing = true;
  scoreEl.textContent = score;
  messageEl.textContent = "";
  timer = setInterval(step, 120);
}

function setDirection(d) {
  const opp = {UP:"DOWN",DOWN:"UP",LEFT:"RIGHT",RIGHT:"LEFT"};
  if (opp[d] !== direction) nextDirection = d;
}

function wrappedDelta(from,to) {
  let d = to-from;
  if (Math.abs(d)>grid/2) d = d>0 ? d-grid : d+grid;
  return d;
}

function moveChaser() {
  const h = snake[0];
  const dx = wrappedDelta(chaser.x,h.x);
  const dy = wrappedDelta(chaser.y,h.y);
  if (Math.abs(dx)>=Math.abs(dy) && dx!==0) chaser.x += Math.sign(dx);
  else if (dy!==0) chaser.y += Math.sign(dy);
  chaser.x=(chaser.x+grid)%grid;
  chaser.y=(chaser.y+grid)%grid;
}

function step() {
  if (!playing) return;
  steps++;
  direction = nextDirection;
  const h = {...snake[0]};

  if (direction==="UP") h.y--;
  if (direction==="DOWN") h.y++;
  if (direction==="LEFT") h.x--;
  if (direction==="RIGHT") h.x++;

  h.x=(h.x+grid)%grid;
  h.y=(h.y+grid)%grid;

  const eating = h.x===food.x && h.y===food.y;
  const body = eating ? snake : snake.slice(0,-1);

  if (body.some(s => s.x===h.x && s.y===h.y)) {
    playing=false;
    clearInterval(timer);
    messageEl.textContent="💥 Chocaste con tu propio cuerpo.";
    return;
  }

  snake.unshift(h);
  if (eating) {
    score++;
    scoreEl.textContent=score;
    food=randomFood();
  } else snake.pop();

  // Muy lento: un movimiento cada 5 movimientos de la viborita.
  if (steps%5===0) moveChaser();

  if (snake.some(s => s.x===chaser.x && s.y===chaser.y) && steps-lastTouch>10) {
    lastTouch=steps;
    heartUntil=performance.now()+1300;
    messageEl.textContent="❤️ ¡Te alcanzó!";
    setTimeout(() => {
      if (playing && performance.now()>=heartUntil) messageEl.textContent="";
    },1400);
  }
}

function dist(a,b) {
  const dx=Math.min(Math.abs(a.x-b.x),grid-Math.abs(a.x-b.x));
  const dy=Math.min(Math.abs(a.y-b.y),grid-Math.abs(a.y-b.y));
  return dx+dy;
}

function drawHeart(x,y,size) {
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(size/32,size/32);
  ctx.fillStyle="#ff356a";
  ctx.beginPath();
  ctx.moveTo(0,10);
  ctx.bezierCurveTo(-18,-3,-30,16,0,32);
  ctx.bezierCurveTo(30,16,18,-3,0,10);
  ctx.fill();
  ctx.restore();
}

function draw(time=0) {
  requestAnimationFrame(draw);

  ctx.fillStyle="#08111f";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle="rgba(255,255,255,.055)";
  for (let i=1;i<grid;i++) {
    const p=i*cell;
    ctx.beginPath(); ctx.moveTo(p,0); ctx.lineTo(p,canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,p); ctx.lineTo(canvas.width,p); ctx.stroke();
  }

  // comida
  ctx.fillStyle="#ef4444";
  ctx.beginPath();
  ctx.arc(food.x*cell+cell/2,food.y*cell+cell/2,cell*.34,0,Math.PI*2);
  ctx.fill();

  // cuerpo
  for (let i=snake.length-1;i>=1;i--) {
    const s=snake[i];
    ctx.fillStyle="#22c55e";
    ctx.beginPath();
    ctx.arc(s.x*cell+cell/2,s.y*cell+cell/2,cell*.38,0,Math.PI*2);
    ctx.fill();
  }

  // cabeza
  const h=snake[0], cx=h.x*cell+cell/2, cy=h.y*cell+cell/2, r=cell*.56;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.clip();
  if (snakeFace.complete) ctx.drawImage(snakeFace,cx-r,cy-r,r*2,r*2);
  ctx.restore();
  ctx.strokeStyle="#fff"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();

  // boca de la viborita
  const open = dist(h,food)<=2 ? 3+Math.abs(Math.sin(time/90))*8 : 2;
  let mx=cx,my=cy,rot=0;
  if(direction==="RIGHT") mx+=r*.45;
  if(direction==="LEFT") {mx-=r*.45;rot=Math.PI;}
  if(direction==="DOWN") {my+=r*.45;rot=Math.PI/2;}
  if(direction==="UP") {my-=r*.45;rot=-Math.PI/2;}
  ctx.save(); ctx.translate(mx,my); ctx.rotate(rot);
  ctx.fillStyle="#16050a"; ctx.beginPath(); ctx.ellipse(0,0,open,5,0,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // Pac-Man hecho con la propia imagen recortada, sin círculo ni silueta
  const px=chaser.x*cell+cell/2, py=chaser.y*cell+cell/2;
  const size=cell*2.05;
  const dx=wrappedDelta(chaser.x,h.x), dy=wrappedDelta(chaser.y,h.y);
  let a=0;
  if (Math.abs(dx)>=Math.abs(dy)) a=dx>=0?0:Math.PI;
  else a=dy>=0?Math.PI/2:-Math.PI/2;

  const bite=.22+Math.abs(Math.sin(time/125))*.5;

  ctx.save();
  ctx.translate(px,py);
  ctx.rotate(a);

  // Recorte en forma de Pac-Man aplicado directamente a la persona.
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.arc(0,0,size*.48,bite,Math.PI*2-bite);
  ctx.closePath();
  ctx.clip();

  if (chaserImg.complete) {
    const ratio=chaserImg.width/chaserImg.height;
    let w=size, hgt=size/ratio;
    if (hgt<size) {hgt=size; w=hgt*ratio;}
    ctx.drawImage(chaserImg,-w/2,-hgt/2,w,hgt);
  }
  ctx.restore();

  if (time<heartUntil) {
    const pulse=1+Math.sin(time/75)*.12;
    ctx.globalAlpha=Math.min(1,(heartUntil-time)/260);
    drawHeart(canvas.width/2,canvas.height/2-24,95*pulse);
    ctx.globalAlpha=1;
  }
}

document.addEventListener("keydown",e=>{
  const map={ArrowUp:"UP",ArrowDown:"DOWN",ArrowLeft:"LEFT",ArrowRight:"RIGHT"};
  if(map[e.key]) {e.preventDefault();setDirection(map[e.key]);}
  if(e.code==="Space"&&!playing) {e.preventDefault();reset();}
});

document.getElementById("up").addEventListener("click",()=>setDirection("UP"));
document.getElementById("down").addEventListener("click",()=>setDirection("DOWN"));
document.getElementById("left").addEventListener("click",()=>setDirection("LEFT"));
document.getElementById("right").addEventListener("click",()=>setDirection("RIGHT"));
document.getElementById("restart").addEventListener("click",reset);

reset();
requestAnimationFrame(draw);
</script>
</body>
</html>
