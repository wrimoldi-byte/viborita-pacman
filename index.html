<!doctype html>
<html lang="es">
<head>

<title>Viborita Pacman</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#172554,#020617 65%);color:#fff;min-height:100vh;display:grid;place-items:center}.wrap{width:min(96vw,720px);padding:14px;text-align:center}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.pill{background:#0f172acc;border:1px solid #38bdf8;border-radius:12px;padding:8px 12px}h1{margin:4px 0 10px;font-size:clamp(24px,6vw,38px);color:#facc15;text-shadow:0 3px #7c2d12}canvas{width:100%;max-width:620px;aspect-ratio:1;display:block;margin:auto;background:#030712;border:3px solid #2563eb;border-radius:18px;box-shadow:0 0 25px #2563eb88;touch-action:none}.help{font-size:14px;color:#cbd5e1;margin:10px}.controls{display:grid;grid-template-columns:repeat(3,64px);justify-content:center;gap:8px}.controls button,#restart,#sound{font-size:22px;padding:10px;border-radius:12px;border:1px solid #475569;background:#111827;color:white}.blank{visibility:hidden}#message{min-height:28px;font-weight:bold;color:#facc15}.legend{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:13px;margin:8px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px}.good{background:#38bdf8}.bad{background:#ef4444}.friend{background:#a3e635}</style>

<body><main class="wrap">
<div class="top"><h1>🐍 Viborita Pacman</h1><div class="pill">Puntaje: <b id="score">0</b> · Vidas: <b id="lives">3</b></div></div>
<canvas id="game" width="620" height="620"></canvas>
<div class="legend"><span><i class="dot friend"></i>Compañeros: +1</span><span><i class="dot good"></i>Walter: escudo</span><span><i class="dot bad"></i>Villano: te persigue</span></div>
<div id="message">Juntá a tus compañeros y evitá al villano.</div>
<button id="restart">Reiniciar</button> <button id="sound">🔊 Sonido</button>
<div class="controls"><button class="blank">·</button><button id="up">▲</button><button class="blank">·</button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button></div>
<p class="help">También podés usar las flechas o WASD. Al salir por un borde, aparecés del otro lado.</p>
</main>

let snake,dir,nextDir,food,villain,score,lives,shield,gameOver,friendIndex;
function rnd(){return {x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}
function occupied(p){return snake.some(q=>q.x===p.x&&q.y===p.y)|| (villain&&villain.x===p.x&&villain.y===p.y)}
function newFood(){do{food=rnd()}while(occupied(food));friendIndex=(friendIndex+1)%6}
function reset(){snake=[{x:5,y:7},{x:4,y:7},{x:3,y:7}];dir={x:1,y:0};nextDir=dir;villain={x:11,y:3};score=0;lives=3;shield=0;gameOver=false;friendIndex=-1;newFood();scoreEl.textContent=score;livesEl.textContent=lives;msg.textContent='Juntá a tus compañeros y evitá al villano.';clearInterval(timer);timer=setInterval(step,175);draw()}
function sound(type){if(!audioOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const now=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.connect(gain);gain.connect(audioCtx.destination);let f=440,d=.09;if(type==='eat'){f=720;d=.07}else if(type==='shield'){f=980;d=.18}else if(type==='hit'){f=130;d=.25;osc.type='sawtooth'}else if(type==='over'){f=90;d=.55;osc.type='square'}osc.frequency.setValueAtTime(f,now);if(type==='shield')osc.frequency.exponentialRampToValueAtTime(1450,now+d);gain.gain.setValueAtTime(.12,now);gain.gain.exponentialRampToValueAtTime(.001,now+d);osc.start(now);osc.stop(now+d)}catch(e){}}
function setDir(dx,dy){if(dx!==-dir.x||dy!==-dir.y)nextDir={x:dx,y:dy}}
function step(){if(gameOver)return;dir=nextDir;let h={x:(snake[0].x+dir.x+N)%N,y:(snake[0].y+dir.y+N)%N};if(snake.some((p,i)=>i>0&&p.x===h.x&&p.y===h.y)){loseLife('¡Te chocaste con tu propia viborita!');return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;scoreEl.textContent=score;msg.textContent='¡Compañero rescatado!';sound('eat');if(score%5===0){shield=35;msg.textContent='¡Walter activó el escudo azul!';sound('shield')}newFood()}else snake.pop();moveVillain();if(h.x===villain.x&&h.y===villain.y){if(shield>0){villain=rnd();score+=2;scoreEl.textContent=score;msg.textContent='¡Escudo azul! Mandaste lejos al villano.'}else loseLife('¡El villano te atrapó!')}if(shield>0)shield--;draw()}
function moveVillain(){if(Math.random()<.32)return;let h=snake[0],opts=[];if(h.x!==villain.x)opts.push({x:villain.x+(h.x>villain.x?1:-1),y:villain.y});if(h.y!==villain.y)opts.push({x:villain.x,y:villain.y+(h.y>villain.y?1:-1)});if(!opts.length)return;let p=opts[Math.floor(Math.random()*opts.length)];villain={x:(p.x+N)%N,y:(p.y+N)%N}}
function loseLife(t){sound('hit');lives--;livesEl.textContent=lives;msg.textContent=t;if(lives<=0){gameOver=true;clearInterval(timer);sound('over');msg.textContent='Fin del juego. Puntaje: '+score}else{snake=[{x:5,y:7},{x:4,y:7},{x:3,y:7}];villain={x:11,y:3};dir=nextDir={x:1,y:0}}}
function face(img,p,r=S*.56,glow='#84cc16'){x.save();x.shadowColor=glow;x.shadowBlur=12;x.beginPath();x.arc((p.x+.5)*S,(p.y+.5)*S,r,0,Math.PI*2);x.fillStyle='#fff';x.fill();x.clip();x.drawImage(img,p.x*S-S*.08,p.y*S-S*.08,S*1.16,S*1.16);x.restore()}
function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#020617';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#1e3a8a';x.lineWidth=1;for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,c.height);x.stroke();x.beginPath();x.moveTo(0,i*S);x.lineTo(c.width,i*S);x.stroke()}for(let i=0;i<60;i++){let px=(i*7%N+.5)*S,py=(i*11%N+.5)*S;x.fillStyle='#facc15';x.beginPath();x.arc(px,py,2.5,0,7);x.fill()}snake.forEach((p,i)=>{x.fillStyle=i?'#22c55e':'#a3e635';x.beginPath();x.arc((p.x+.5)*S,(p.y+.5)*S,S*(i?0.38:0.46),0,7);x.fill()});let h=snake[0];x.fillStyle='#111';x.beginPath();x.arc((h.x+.35)*S,(h.y+.38)*S,3,0,7);x.arc((h.x+.65)*S,(h.y+.38)*S,3,0,7);x.fill();face(imgs['coworker'+(friendIndex+1)],food,S*.55,'#a3e635');face(imgs.villain,villain,S*.62,'#ef4444');if(shield>0){x.strokeStyle='#38bdf8';x.lineWidth=5;x.beginPath();x.arc((h.x+.5)*S,(h.y+.5)*S,S*.65,0,7);x.stroke();x.globalAlpha=.9;x.drawImage(imgs.hero,8,8,64,64);x.globalAlpha=1}}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='arrowup'||k==='w')setDir(0,-1);if(k==='arrowdown'||k==='s')setDir(0,1);if(k==='arrowleft'||k==='a')setDir(-1,0);if(k==='arrowright'||k==='d')setDir(1,0)});[['up',0,-1],['down',0,1],['left',-1,0],['right',1,0]].forEach(([id,a,b])=>document.getElementById(id).onclick=()=>setDir(a,b));document.getElementById('restart').onclick=reset;document.getElementById('sound').onclick=()=>{audioOn=!audioOn;document.getElementById('sound').textContent=audioOn?'🔊 Sonido':'🔇 Silencio';if(audioOn)sound('eat')};let sx,sy;c.addEventListener('touchstart',e=>{let t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});c.addEventListener('touchend',e=>{let t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1)},{passive:true});reset();
</script></body></html>
