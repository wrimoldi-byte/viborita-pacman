ementById('g'),x=c.getContext('2d'),N=12,S=c.width/N,sc=document.getElementById('sc'),li=document.getElementById('li'),m=document.getElementById('m');let fi=new Image(),wi=new Image(),vi=new Image();fi.src=F;wi.src=W;vi.src=V;let snake,dir,next,food,walter,villain,score,lives,timer,shield,flash,flashImg,on=true,ctx;const same=(a,b)=>a.x===b.x&&a.y===b.y;function cell(ex=[]){let p;do p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};while(ex.some(q=>same(p,q)));return p}function beep(f=500,d=.08,t='sine'){if(!on)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.type=t;o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.stop(ctx.currentTime+d)}catch(e){}}function reset(all=true){if(all){score=0;lives=3}snake=[{x:3,y:6},{x:2,y:6},{x:1,y:6}];dir=next={x:1,y:0};food=cell(snake);walter=cell([...snake,food]);villain=cell([...snake,food,walter]);shield=0;flash=0;sc.textContent=score;li.textContent=lives;m.textContent='Compañero +1 · Walter +3 y escudo · evitá al villano';clearInterval(timer);timer=setInterval(step,160);draw()}function moveV(){let h=snake[0],dx=(h.x-villain.x+N)%N,dy=(h.y-villain.y+N)%N,sx=dx===0?0:(dx<N/2?1:-1),sy=dy===0?0:(dy<N/2?1:-1),o=Math.random()<.5?{x:sx,y:0}:{x:0,y:sy};villain={x:(villain.x+o.x+N)%N,y:(villain.y+o.y+N)%N}}function lose(){lives--;li.textContent=lives;beep(120,.25,'sawtooth');if(lives<=0){clearInterval(timer);m.textContent='Fin del juego. Puntaje: '+score}else{m.textContent='¡Te atraparon!';setTimeout(()=>reset(false),600)}}function step(){dir=next;let h={x:(snake[0].x+dir.x+N)%N,y:(snake[0].y+dir.y+N)%N};if(snake.slice(1).some(p=>same(p,h)))return lose();snake.unshift(h);let grow=false;if(same(h,food)){score++;grow=true;flash=Date.now()+1700;flashImg=fi;food=cell([...snake,walter,villain]);m.textContent='¡Compañero rescatado! +1';beep(760)}if(same(h,walter)){score+=3;shield=Date.now()+6000;flash=Date.now()+1700;flashImg=wi;walter=cell([...snake,food,villain]);m.textContent='¡Walter te protege! +3 y escudo por 6 segundos';beep(980,.14)}if(!grow)snake.pop();moveV();if(same(snake[0],villain)){if(Date.now()<shield){villain=cell([...snake,food,walter]);m.textContent='¡El escudo frenó al villano!'}else return lose()}sc.textContent=score;draw()}function face(im,p,color){let a=p.x*S+S/2,b=p.y*S+S/2,r=S*.41;x.save();x.beginPath();x.arc(a,b,r,0,7);x.clip();x.drawImage(im,a-r,b-r,r*2,r*2);x.restore();x.strokeStyle=color;x.lineWidth=4;x.beginPath();x.arc(a,b,r,0,7);x.stroke()}function draw(){x.fillStyle='#030712';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#12213b';for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,c.height);x.stroke();x.beginPath();x.moveTo(0,i*S);x.lineTo(c.width,i*S);x.stroke()}face(fi,food,'#a3e635');face(wi,walter,'#38bdf8');face(vi,villain,'#ef4444');snake.forEach((p,i)=>{x.fillStyle=i?'#22c55e':'#facc15';x.beginPath();x.arc(p.x*S+S/2,p.y*S+S/2,i?S*.32:S*.42,0,7);x.fill()});if(Date.now()<shield){let p=snake[0];x.strokeStyle='#38bdf8';x.lineWidth=5;x.beginPath();x.arc(p.x*S+S/2,p.y*S+S/2,S*.48,0,7);x.stroke()}if(Date.now()<flash&&flashImg){x.fillStyle='#020617dd';x.fillRect(c.width*.3,c.height*.3,c.width*.4,c.height*.4);x.save();x.beginPath();x.arc(c.width/2,c.height/2,c.width*.17,0,7);x.clip();x.drawImage(flashImg,c.width*.33,c.height*.33,c.width*.34,c.height*.34);x.restore()}}function set(a,b){if(a!==-dir.x||b!==-dir.y)next={x:a,y:b}}addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='arrowup'||k==='w')set(0,-1);if(k==='arrowdown'||k==='s')set(0,1);if(k==='arrowleft'||k==='a')set(-1,0);if(k==='arrowright'||k==='d')set(1,0)});[['u',0,-1],['d',0,1],['l',-1,0],['r',1,0]].forEach(q=>document.getElementById(q[0]).onclick=()=>set(q[1],q[2]));document.getElementById('re').onclick=()=>reset(true);document.getElementById('so').onclick=e=>{on=!on;e.target.textContent=on?'🔊 Sonido'
