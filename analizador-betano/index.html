<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analizador de juegos</title><style>body{font-family:system-ui;background:#07111f;color:#fff;margin:0}.w{max-width:720px;margin:auto;padding:18px}.c{background:#111827;border:1px solid #334155;border-radius:16px;padding:15px;margin:12px 0}input,select,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:16px}button{background:#0284c7;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.games{display:grid;grid-template-columns:1fr 1fr;gap:9px}.g{padding:12px;background:#0f172a;border:1px solid #334155;border-radius:12px}.g.active{border-color:#38bdf8}.muted{color:#94a3b8}.good{color:#86efac}.bad{color:#fca5a5}@media(max-width:520px){.grid,.games{grid-template-columns:1fr}}</style></head><body><main class="w"><h1>🎯 Analizador de juegos</h1><p class="muted">Seguimiento manual de sesión. No predice premios ni juegos “calientes”.</p><section class="c"><h2>Elegí un juego</h2><input id="q" placeholder="Buscar juego"><div id="games" class="games"></div></section><section class="c"><h2>Sesión en vivo</h2><div id="chosen" class="muted">Sin juego seleccionado</div><div class="grid"><div><label>Saldo inicial</label><input id="start" type="number" value="5000"></div><div><label>Límite de pérdida</label><input id="limit" type="number" value="2000"></div></div><button id="begin">Iniciar sesión</button><div id="live" style="display:none"><div class="grid"><div><label>Saldo actual</label><input id="current" type="number"></div><div><label>Tiempo</label><input id="time" disabled value="00:00"></div></div><button id="update">Actualizar análisis</button><h3 id="result"></h3><p id="advice" class="muted"></p></div></section><section class="c"><h2>Datos del juego</h2><div id="data" class="muted">Seleccioná un juego.</div></section></main><script>const list=[['Sweet Bonanza','Slots',96.51,'Alta'],['Gates of Olympus','Slots',96.50,'Alta'],['Big Bass Bonanza','Slots',96.71,'Alta'],['Sugar Rush','Slots',96.50,'Alta'],['The Dog House','Slots',96.51,'Alta'],['Starlight Princess','Slots',96.50,'Alta'],['Ruleta europea','Mesa',97.30,'Media'],['Blackjack','Mesa',99.00,'Media'],['Baccarat','Mesa',98.94,'Media'],['Aviator / Crash','Instantáneo',97.00,'Alta']];let selected=null,started=0,timer=null;const $=x=>document.getElementById(x);function render(){let q=$('q').value.toLowerCase();$('games').innerHTML=list.map((g,i)=>({g,i})).filter(x=>x.g[0].toLowerCase().includes(q)||x.g[1].toLowerCase().includes(q)).map(x=>`<button class="g ${selected===x.i?'active':''}" onclick="pick(${x.i})"><b>${x.g[0]}</b><br><small>${x.g[1]} · RTP ${x.g[2]}% · ${x.g[3]}</small></button>`).join('')}window.pick=i=>{selected=i;let g=list[i];$('chosen').textContent='Juego: '+g[0];$('data').innerHTML=`<b>${g[0]}</b><br>Categoría: ${g[1]}<br>RTP de referencia: ${g[2]}%<br>Volatilidad: ${g[3]}<br><small>Verificá el RTP dentro de las reglas del juego en Betano.</small>`;render()};$('q').oninput=render;$('begin').onclick=()=>{if(selected===null)return alert('Elegí un juego.');started=Date.now();$('current').value=$('start').value;$('live').style.display='block';clearInterval(timer);timer=setInterval(()=>{let s=Math.floor((Date.now()-started)/1000);$('time').value=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);analyze()};function analyze(){let a=+$('start').value,c=+$('current').value,l=+$('limit').value,d=c-a;$('result').className=d>=0?'good':'bad';$('result').textContent=(d>=0?'Ganancia: $':'Pérdida: $')+Math.abs(d).toLocaleString('es-AR');let loss=Math.max(0,-d),pct=l?Math.round(loss/l*100):0;$('advice').textContent=loss>=l?'⛔ Alcanzaste el límite de pérdida. La recomendación es detenerte.':loss>=l*.75?'⚠️ Estás cerca del límite ('+pct+'%). Considerá terminar la sesión.':d>0?'Vas en ganancia. Podés fijar un punto de retiro para no devolverla.':'Llevás '+pct+'% del límite de pérdida.'} $('update').onclick=analyze;render();</script></body></html>
