<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Viborita Pacman - efecto de compañeros</title>
<style>
  html,body{margin:0;min-height:100%;background:#020617;color:#fff;font-family:Arial,sans-serif}
  body{display:grid;place-items:center}
  .stage{position:relative;width:min(100vw,760px);min-height:100vh;overflow:hidden;background:#020617}
  iframe{display:block;width:100%;height:100vh;border:0;transition:filter .22s ease,opacity .22s ease}
  .stage.flash iframe{filter:blur(3px) brightness(.62);opacity:.92}
  .pickup{
    position:absolute;z-index:10;pointer-events:none;display:none;
    width:190px;height:190px;border-radius:50%;overflow:hidden;
    border:6px solid #a3e635;background:#fff;
    box-shadow:0 0 0 8px #ffffff44,0 0 36px #84cc16;
    transform:translate(-50%,-50%) scale(.55);opacity:0;
  }
  .pickup.show{display:block;animation:pop 1.8s ease forwards}
  .pickup.dana{width:240px;height:240px;border-color:#38bdf8;box-shadow:0 0 0 10px #ffffff55,0 0 50px #38bdf8}
  .pickup img{width:100%;height:100%;object-fit:cover;display:block}
  .label{
    position:absolute;z-index:11;pointer-events:none;display:none;
    transform:translate(-50%,0);padding:8px 14px;border-radius:999px;
    background:#020617dd;border:1px solid #fff;color:#fff;font-weight:bold;
    text-align:center;white-space:nowrap;box-shadow:0 8px 24px #0009
  }
  .label.show{display:block;animation:label 1.8s ease forwards}
  @keyframes pop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}
    18%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
    30%,75%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.18)}
  }
  @keyframes label{
    0%,10%{opacity:0;transform:translate(-50%,8px)}
    20%,75%{opacity:1;transform:translate(-50%,0)}
    100%{opacity:0;transform:translate(-50%,-8px)}
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <iframe id="game" src="index.html?v=9" title="Viborita Pacman"></iframe>
  <div id="pickup" class="pickup"><img id="pickupImg" alt="Compañero recogido"></div>
  <div id="label" class="label"></div>
</div>
<script>
const frame=document.getElementById('game');
const stage=document.getElementById('stage');
const pickup=document.getElementById('pickup');
const pickupImg=document.getElementById('pickupImg');
const label=document.getElementById('label');
let previousScore=0,hideTimer;
const names=['Dana','Compañero 2','Compañera 3','Compañera 4','Compañero 5','Compañera 6'];

function safeEval(w,code){try{return w.eval(code)}catch(e){return null}}
function showPickup(){
  const w=frame.contentWindow;
  const score=safeEval(w,'score');
  if(typeof score!=='number')return;
  if(score<previousScore){previousScore=score;return}
  if(score===previousScore)return;
  const idx=safeEval(w,'(friendIndex+5)%6');
  const head=safeEval(w,'snake&&snake[0]?({x:snake[0].x,y:snake[0].y}):null');
  const src=safeEval(w,'imgs["coworker"+('+idx+'+1)]&&imgs["coworker"+('+idx+'+1)].src');
  previousScore=score;
  if(!head||!src)return;

  const canvas=frame.contentDocument.getElementById('game');
  if(!canvas)return;
  const fr=frame.getBoundingClientRect();
  const cr=canvas.getBoundingClientRect();
  const x=fr.left+cr.left+(head.x+.5)*(cr.width/14);
  const y=fr.top+cr.top+(head.y+.5)*(cr.height/14);

  pickupImg.src=src;
  pickup.style.left=x+'px';
  pickup.style.top=y+'px';
  label.style.left=x+'px';
  label.style.top=(y+(idx===0?132:108))+'px';
  label.textContent=idx===0?'¡Dana te protege!':names[idx];
  pickup.className='pickup'+(idx===0?' dana':'');
  pickup.classList.remove('show');label.classList.remove('show');
  void pickup.offsetWidth;
  pickup.classList.add('show');label.classList.add('show');stage.classList.add('flash');
  clearTimeout(hideTimer);
  hideTimer=setTimeout(()=>{pickup.classList.remove('show');label.classList.remove('show');stage.classList.remove('flash')},1850);
}
frame.addEventListener('load',()=>{
  previousScore=safeEval(frame.contentWindow,'score')||0;
  setInterval(showPickup,70);
});
</script>
</body>
</html>
